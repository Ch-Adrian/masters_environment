  taskmanager:
    build:
      context: .
      dockerfile: ./dockers/taskmanager/Dockerfile2
    depends_on:
      - jobmanager
    ports:
      - "6122:6122"
    networks:
      - common_network
    scale: 1
    privileged: true
    command: >
      sh -c "cp /taskmanager-logs/flink-conf.yaml /opt/flink-1.17.2/conf/flink-conf.yaml &&
             taskmanager.sh start-foreground"
    volumes:
      - /sys:/sys
      - /proc:/proc
      - /lib/modules:/lib/modules:ro
      - ./taskmanager-logs:/taskmanager-logs
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.numberOfTaskSlots: 4
        jobmanager.memory.process.size: 2048m
        taskmanager.memory.process.size: 4096m

networks:
  common_network: